backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
media_folder: "static/images"
public_folder: "/images"

site_url: https://magdi.work
display_url: https://magdi.work
logo_url: https://magdi.work/favicon.ico

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - label: "Cover Image"
        name: "cover"
        widget: "object"
        required: false
        fields:
          - { label: "Image", name: "image", widget: "image", required: false, media_library: { config: { multiple: false } } }
          - { label: "Alt Text", name: "alt", widget: "string", required: false }
          - { label: "Relative", name: "relative", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
